<div class="app-shell">
  <nav class="sidebar">
    <div class="logo">
      <img src="assets/parceiro-auto-logo-horizontal.svg" alt="Logo da empresa" />
    </div>

    <div class="menu">
      @if (companies().length > 0) {
        <div class="current-company">
          <label for="currentCompany">Empresa atual</label>
          <select
            id="currentCompany"
            class="company-select"
            [ngModel]="currentCompanyId()"
            (ngModelChange)="setCurrentCompany($event)">
            @for (company of companies(); track company.id) {
              <option [ngValue]="company.id">{{ company.tradeName }}</option>
            }
          </select>
        </div>
      }
      <p class="group">Visão geral</p>

      <a class="item" routerLink="/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h6v8H4zM4 16h6v4H4zM14 12h6v8h-6zM14 4h6v4h-6z"/>
        </svg>
        Dashboard
      </a>

      <p class="group">Cadastros</p>

      <a class="item" routerLink="/companies" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M5 21V7l7-4 7 4v14"/>
          <path d="M10 9h.01M14 9h.01M10 13h.01M14 13h.01M10 17h4"/>
        </svg>
        Empresas
      </a>

      <a class="item" routerLink="/bank-accounts" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 6l7-3 7 3v4H5z"/>
          <path d="M6 10v11M10 10v11M14 10v11M18 10v11"/>
        </svg>
        Contas bancárias
      </a>


      <p class="group">Financeiro</p>

      <a class="item" routerLink="/transactions" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 10h14l-4-4M17 14H3l4 4"/>
        </svg>
        Fluxo de caixa
      </a>

      <!-- Enable this navigation item when its feature is ready. -->
      <a class="item disabled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
        </svg>
        Relatórios (Em breve)
      </a>

      <p class="group">Sistema</p>

      <!-- Enable this navigation item when its feature is ready. -->
      <a class="item disabled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20v-1a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v1"/>
          <path d="M16 6a3 3 0 0 1 0 6M18 15a4 4 0 0 1 3 4v1"/>
        </svg>
        Gestão de acessos <br> (Em breve)
      </a>
    </div>

    <div class="footer">
      <span class="avatar">{{ userInitials() }}</span>
      <span class="user">
        <span class="user-name">{{ user()?.name ?? 'Usuário' }}</span>
        <span class="user-role">{{ user()?.role === 'admin' ? 'Administrador' : 'Usuário' }}</span>
      </span>
      <button
        type="button"
        class="logout"
        (click)="logout()"
        aria-label="Sair do sistema"
        title="Sair do sistema"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/>
          <path d="M9 12h12l-3-3M18 15l3-3"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
