<main class="login-page">
  <section class="login-card" aria-label="Formulário de login">
    <div class="logo">
      <img src="assets/parceiro-auto-logo-horizontal.svg" alt="Logo da empresa" />
    </div>
    <h1>Entrar</h1>
    <p class="subtitle">
      Use o e-mail corporativo e a senha cadastrada para acessar o painel.
    </p>

    <div *ngIf="error(); else noError" class="error-banner">
      <p>{{ error() }}</p>
      <button type="button" class="close-button" (click)="clearError()">✕</button>
    </div>
    <ng-template #noError></ng-template>

    <form (ngSubmit)="login()" class="form">
      <div class="field-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="nome@empresa.com"
          [(ngModel)]="email"
          name="email"
          [disabled]="loading()"
        />
      </div>

      <div class="field-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          placeholder="Sua senha"
          [(ngModel)]="password"
          name="password"
          [disabled]="loading()"
        />
      </div>

      <button type="submit" class="login-btn" [disabled]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <button type="button" class="register-btn" routerLink="/register" [disabled]="loading()">
      Cadastrar
    </button>


  </section>
</main>
