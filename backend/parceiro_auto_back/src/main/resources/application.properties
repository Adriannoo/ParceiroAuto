spring.application.name=parceiro-auto

spring.main.banner-mode=off
logging.level.org.springframework=ERROR

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=jdbc:postgresql://localhost:5432/parceiro_auto
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.datasource.driver-class-name=org.postgresql.Driver

# Configura a API externa e evita espera sem limite nas consultas.
integrations.brasil-api.url=https://brasilapi.com.br
spring.cloud.openfeign.client.config.brasilApi.connectTimeout=3000
spring.cloud.openfeign.client.config.brasilApi.readTimeout=5000

# Exibe os eventos da aplicacao sem depender do nivel dos logs do Spring.
logging.level.br.edu.uniamerica.parceiro_auto=INFO
